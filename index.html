<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MesStore - Katalog Produk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 id="store-name" class="font-bold text-lg text-indigo-600">MesStore Official</h1>
            <p class="text-xs text-slate-500">Katalog Belanja Praktis</p>
        </div>
        <button onclick="toggleCart()" class="relative bg-indigo-50 text-indigo-600 p-2.5 rounded-full hover:bg-indigo-100 transition">
            <i class="fa-solid fa-bag-shopping text-lg"></i>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- BANNER / PROMO -->
        <div class="bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-2xl p-4 mb-6 shadow-md">
            <h2 class="font-bold text-base mb-1">🔥 Promo Spesial Minggu Ini!</h2>
            <p class="text-xs text-indigo-100">Dapatkan diskon menarik dan gratis ongkir untuk pembelian produk tertentu hari ini.</p>
        </div>

        <!-- LIST PRODUK -->
        <h3 class="font-bold text-slate-700 mb-3 text-sm tracking-wide uppercase">Daftar Produk</h3>
        <div id="product-list" class="grid grid-cols-2 gap-3">
            <!-- Produk akan dirender lewat JavaScript -->
        </div>
    </main>

    <!-- DRAWER KERANJANG BELANJA (MODAL) -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs hidden flex justify-end">
        <div class="bg-white w-full max-w-sm h-full flex flex-col shadow-2xl animate-in slide-in-from-right duration-300">
            <!-- Header Keranjang -->
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-base">Keranjang Belanja</h3>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- List Item di Keranjang -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Item keranjang masuk sini -->
                <p class="text-center text-slate-400 text-sm mt-10">Keranjang masih kosong</p>
            </div>

            <!-- Footer Keranjang & Form Checkout -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="space-y-2">
                    <input type="text" id="buyer-name" placeholder="Nama Lengkap" class="w-full text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
                    <textarea id="buyer-address" placeholder="Alamat Pengiriman Lengkap" rows="2" class="w-full text-sm bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <div class="flex justify-between items-center text-sm font-semibold pt-2 border-t border-slate-200">
                    <span>Total:</span>
                    <span id="cart-total" class="text-indigo-600 font-bold text-base">Rp 0</span>
                </div>

                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Pesan via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // DATA PRODUK (Klien tinggal ganti data ini atau sambungkan ke Google Sheets API)
        const products = [
            { id: 1, name: "Kemeja Flanel Casual", price: 85000, image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400&auto=format&fit=crop&q=60" },
            { id: 2, name: "Hoodie Polos Premium", price: 135000, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&auto=format&fit=crop&q=60" },
            { id: 3, name: "Topi Baseball Distro", price: 45000, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400&auto=format&fit=crop&q=60" },
            { id: 4, name: "Celana Chinos Panjang", price: 110000, image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400&auto=format&fit=crop&q=60" }
        ];

        let cart = [];
        const waSellerNumber = "6281232885866"; // Ganti dengan nomor WhatsApp klien (format 62 tanpa +)

        // Render Produk ke Layar
        function renderProducts() {
            const listContainer = document.getElementById('product-list');
            listContainer.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-xs flex flex-col justify-between">
                    <div>
                        <img src="${p.image}" alt="${p.name}" class="w-full h-32 object-cover rounded-xl mb-2">
                        <h4 class="font-semibold text-xs text-slate-800 line-clamp-1">${p.name}</h4>
                        <p class="text-indigo-600 font-bold text-xs mt-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-600 font-semibold py-1.5 rounded-lg text-xs transition">
                        + Tambah
                    </button>
                </div>
            `).join('');
        }

        // Buka/Tutup Modal Keranjang
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        // Tambah Produk ke Keranjang
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            toggleCart(); // Otomatis buka keranjang saat produk ditambah (opsional)
        }

        // Update Tampilan Keranjang & Badge
        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const cartItemsContainer = document.getElementById('cart-items');
            const totalElement = document.getElementById('cart-total');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Badge Header
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Isi List Keranjang
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center text-slate-400 text-sm mt-10">Keranjang masih kosong</p>`;
            } else {
                cartItemsContainer.innerHTML = cart.map((item, index) => `
                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <div class="flex-1 pr-2">
                            <h5 class="text-xs font-semibold text-slate-800 line-clamp-1">${item.name}</h5>
                            <p class="text-[11px] text-indigo-600 font-bold">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${index}, -1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-xs font-bold flex items-center justify-center">-</button>
                            <span class="text-xs font-semibold">${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)" class="w-6 h-6 bg-white border border-slate-200 rounded-md text-xs font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `).join('');
            }

            totalElement.innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        // Ubah Jumlah Qty di Keranjang
        function changeQty(index, amount) {
            cart[index].qty += amount;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        // Proses Kirim Pesanan ke WhatsApp
        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("Keranjang belanja masih kosong!");
                return;
            }

            const name = document.getElementById('buyer-name').value.trim();
            const address = document.getElementById('buyer-address').value.trim();

            if (!name || !address) {
                alert("Mohon isi Nama dan Alamat pengiriman terlebih dahulu!");
                return;
            }

            let message = `Halo Kak, saya ingin memesan produk berikut:%0A%0A`;
            
            cart.forEach((item, idx) => {
                message += `${idx + 1}. ${item.name} (x${item.qty}) = Rp ${(item.price * item.qty).toLocaleString('id-ID')}%0A`;
            });

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            message += `%0A*Total Belanja:* Rp ${totalPrice.toLocaleString('id-ID')}%0A%0A`;
            message += `*Data Penerima:*%0ANama: ${name}%0Alamat: ${address}%0A%0AMohon info total beserta ongkirnya ya, terima kasih!`;

            // Buka Link WhatsApp
            const waUrl = `https://wa.me/${waSellerNumber}?text=${message}`;
            window.open(waUrl, '_blank');
        }

        // Inisialisasi saat pertama muat
        renderProducts();
    </script>
</body>
</html>
